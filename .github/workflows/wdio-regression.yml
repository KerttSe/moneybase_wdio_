# Manual regression run: choose platform and category checkboxes.
name: WDIO Regression

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      bs_app_ios:
        description: "BrowserStack iOS app id (bs://...). Overrides BS_APP_IOS secret."
        required: false
        type: string
      bs_app_android:
        description: "BrowserStack Android app id (bs://...). Overrides BS_APP_ANDROID secret."
        required: false
        type: string
      home_navigation:
        description: "Home & Navigation"
        required: false
        default: true
        type: boolean
      bank_transfers:
        description: "Bank Transfers & Beneficiaries"
        required: false
        default: true
        type: boolean
      payments:
        description: "Payments, Top-ups & FX"
        required: false
        default: true
        type: boolean
      cards:
        description: "Business, Personal & Joint Cards"
        required: false
        default: true
        type: boolean
      invest:
        description: "Invest"
        required: false
        default: true
        type: boolean
      authentication:
        description: "Authentication"
        required: false
        default: true
        type: boolean
      onboarding_account:
        description: "Onboarding, Personal Details & Price Plans"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  setup-regression:
    name: Build regression lanes
    runs-on: arc-runner-mb-deploy-stg-scale-set
    outputs:
      lane1_matrix: ${{ steps.build.outputs.lane1_matrix }}
      lane2_matrix: ${{ steps.build.outputs.lane2_matrix }}
      lane1_count: ${{ steps.build.outputs.lane1_count }}
      lane2_count: ${{ steps.build.outputs.lane2_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build selected category lanes
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
          ALL_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { laneOrder } = require('./scripts/regressionLanes.cjs');
          const inputs = JSON.parse(process.env.ALL_INPUTS_JSON || '{}');
          // Category membership only selects specs. Account owners and lane order come from
          // src/data/regressionAccounts.json through scripts/regressionLanes.cjs.
          const categories = {
            home_navigation: {
              name: "Home & Navigation",
              specs: [
                'launch.spec.ts',
                'homeSearch.spec.ts',
                'homeSearch.business.spec.ts',
                'homeSpendAnalytics.spec.ts',
                'homeStoryly.spec.ts',
                'home.recentPayees.spec.ts',
                'home.cardsTabReselect.spec.ts',
                'home.totalWealthNavigation.spec.ts',
                'support.loggedInOptions.spec.ts',
                'support.close.spec.ts',
                'support.openChat.spec.ts',
                'authentication.welcomeSignIn.spec.ts',
                'lifecycle.regression.spec.ts',
                'lifecycle.freshInstallWelcome.spec.ts',
                'homeScreen.spec.ts',
                'homeAccountSwitch.spec.ts',
                'accountPicker.search.spec.ts',
              ],
            },
            bank_transfers: {
              name: "Bank Transfers & Beneficiaries",
              specs: [
                'addFundsBankTransferWalletManager.spec.ts',
                'walletManager.openDetails.spec.ts',
                'walletManager.ibanBankNameUSD.spec.ts',
                'walletManager.ibanBankNameEUR.spec.ts',
                'walletDetails.statementBusiness.spec.ts',
                'walletDetails.statementIndividual.spec.ts',
                'bankTransfer.business.spec.ts',
                'bankTransfer.businessUnavailable.spec.ts',
                'bankTransfer.p2p.individual.spec.ts',
                'bankTransfer.sepa.individual.spec.ts',
                'bankTransfer.sepaAmountLength.spec.ts',
                'bankTransfer.sepaReferenceLimit.spec.ts',
                'bankTransfer.sepaNoFee.spec.ts',
                'bankTransfer.sepaReviewClose.spec.ts',
                'bankTransfer.swift.individual.spec.ts',
                'crossBorder.swift.retail.spec.ts',
                'bankTransfer.swiftFeeCancel.spec.ts',
                'bankTransfer.swiftFeeDisclaimer.spec.ts',
                'bankTransfer.swiftWalletCancel.spec.ts',
                'vop.beneficiary.spec.ts',
                'vop.sepa.spec.ts',
                'addbeneficiary.individual.spec.ts',
                'addbeneficiary.individual.usd.steps.spec.ts',
                'addbeneficiary.individual.usBicSwiftInvalid.spec.ts',
                'beneficiary.nameValidation.spec.ts',
                'beneficiary.ibanLength.spec.ts',
                'beneficiary.ibanChecksum.spec.ts',
                'beneficiary.ibanCountry.spec.ts',
              ],
            },
            payments: {
              name: "Payments, Top-ups & FX",
              specs: [
                'autoTopUp.spec.ts',
                'addFunds.businessMethods.spec.ts',
                'autoTopUp.validation.spec.ts',
                'autoTopUp.editUnchanged.spec.ts',
                'autoTopUp.currencyReset.spec.ts',
                'autoTopUp.amountAboveRange.spec.ts',
                'autoTopUp.amountBelowRange.spec.ts',
                'transactions.spec.ts',
                'addfunds.spec.ts',
                'addfunds.validation.spec.ts',
                'fxExchange.spec.ts',
                'fxExchange.regression.spec.ts',
                'salaryStipendPension.spec.ts',
                'salary.partialValidation.spec.ts',
              ],
            },
            cards: {
              name: "Cards",
              specs: [
                'assignBusinessCard.spec.ts',
                'businessCard.changeTypeClearsAssignee.spec.ts',
                'businessCard.cancelCardType.spec.ts',
                'businessCard.adminSelfAssign.spec.ts',
                'businessCard.cardLimits.spec.ts',
                'cardFreezeUnfreeze.joint.spec.ts',
                'cardManagement.joint.spec.ts',
                'cardManagement.viewPin.spec.ts',
                'cardManagement.pinTimeout.spec.ts',
                'businessCard.noRights.spec.ts',
                'physicalcardcreation.spec.ts',
                'businessCard.freezeUnfreeze.otherPerson.spec.ts',
                'businessCard.terminate.spec.ts',
                'businessCard.relink.spec.ts',
                'businessCard.activeFilterDefault.spec.ts',
                'businessCard.walletReachOut.spec.ts',
                'businessWallet.requiredName.spec.ts',
                'businessWallet.cancelCreation.spec.ts',
              ],
            },
            invest: {
              name: "Invest",
              specs: [
                'portfolio.spec.ts',
                'orders.spec.ts',
                'orders.regression.spec.ts',
                'priceAlerts.spec.ts',
                'cashFunds.spec.ts',
                'watchlist.spec.ts',
              ],
            },
            authentication: {
              name: "Authentication",
              specs: [
                'authentication.incorrectPasscode.spec.ts',
                'authentication.passcodeLockout.spec.ts',
                'authentication.otpCountdown.spec.ts',
                'authentication.phoneValidation.spec.ts',
                'authentication.securityAccount.spec.ts',
                'authentication.incorrectOtp.spec.ts',
                'authentication.otpLockout.spec.ts',
                'authentication.partialPasscode.spec.ts',
                'authentication.changePasscodeCancel.spec.ts',
                'authentication.recoveryQuestions.spec.ts',
              ],
            },
            onboarding_account: {
              name: "Onboarding & Account",
              specs: [
                'personalDetails.spec.ts',
                'profile.businessSettings.spec.ts',
                'profile.appearance.spec.ts',
                'personalDetails.nameEditConfirmation.spec.ts',
                'profile.logout.spec.ts',
                'onboarding.spec.ts',
                'onboarding.invalidNames.spec.ts',
                'onboarding.shortName.spec.ts',
                'onboarding.addressOptional.spec.ts',
                'onboarding.addressRequired.spec.ts',
                'onboarding.employmentFields.spec.ts',
                'onboarding.previousEmployment.spec.ts',
                'onboarding.nameRequired.spec.ts',
                'onboarding.otpRetry.spec.ts',
                'onboarding.otpResend.spec.ts',
                'onboarding.keyboardRaise.spec.ts',
                'onboarding.keyboardRestore.spec.ts',
                'onboarding.passcodePolicy.spec.ts',
                'onboarding.emailTerms.spec.ts',
                'pricePlan.spec.ts',
              ],
            },
          };
          // Reject missing, duplicated or stale specs instead of silently reducing coverage.
          // Specs sit in domain folders (src/tests/<Area>/<feature>/); categories list unique file names.
          const specFiles = new Map(fs.readdirSync('src/tests', { recursive: true })
            .filter(spec => spec.endsWith('.spec.ts'))
            .map(spec => spec.replaceAll('\\', '/'))
            .map(spec => [spec.slice(spec.lastIndexOf('/') + 1), 'src/tests/' + spec]));
          const existingSpecs = [...specFiles.keys()].sort();
          const checkCoverage = (label, mapped) => {
            const mappedSet = new Set(mapped);
            const existingSet = new Set(existingSpecs);
            const missing = existingSpecs.filter(spec => !mappedSet.has(spec));
            const stale = mapped.filter(spec => !existingSet.has(spec));
            const duplicates = mapped.filter((spec, index) => mapped.indexOf(spec) !== index);
            if (missing.length || stale.length || duplicates.length) {
              throw new Error('Invalid regression ' + label + ': ' + JSON.stringify({ missing, stale, duplicates }));
            }
          };
          checkCoverage('categories', Object.values(categories).flatMap(category => category.specs));
          checkCoverage('account lanes', [...laneOrder('lane1'), ...laneOrder('lane2')]);

          const platformInput = process.env.PLATFORM_INPUT || 'all';
          if (!['all', 'android', 'ios'].includes(platformInput)) {
            throw new Error('Unsupported platform: ' + platformInput);
          }
          const platforms = platformInput === 'all' ? ['android', 'ios'] : [platformInput];
          const selected = new Set();
          const summary = ['### Regression blocks selected', ''];
          for (const [key, category] of Object.entries(categories)) {
            const value = inputs[key];
            const isSelected = value == null || value === true || value === 'true';
            summary.push('- [' + (isSelected ? 'x' : ' ') + '] ' + category.name + ' (' + category.specs.length + ' specs)');
            if (isSelected) category.specs.forEach(spec => selected.add(spec));
          }
          if (selected.size === 0) {
            throw new Error('Select at least one regression category.');
          }

          const specPath = spec => {
            if (!specFiles.has(spec)) throw new Error('Spec ' + spec + ' was not found under src/tests');
            return specFiles.get(spec);
          };
          // Each lane is one BrowserStack parallel. Its blocks run one after another in lane order.
          const BLOCK_SIZE = 15;
          const lanes = {};
          for (const lane of ['lane1', 'lane2']) {
            const order = laneOrder(lane, spec => selected.has(spec));
            const blocks = [];
            for (let start = 0; start < order.length; start += BLOCK_SIZE) blocks.push(order.slice(start, start + BLOCK_SIZE));
            lanes[lane] = platforms.flatMap(platform => blocks.map((specs, index) => ({
              platform,
              block: 'part ' + (index + 1) + '/' + blocks.length,
              specs: specs.map(specPath).join(','),
            })));
            summary.push('', lane + ': ' + order.length + ' specs in ' + blocks.length + ' blocks per platform');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          const outputs = {
            lane1_matrix: JSON.stringify({ include: lanes.lane1 }),
            lane2_matrix: JSON.stringify({ include: lanes.lane2 }),
            lane1_count: lanes.lane1.length,
            lane2_count: lanes.lane2.length,
          };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(outputs).map(([key, value]) => key + '=' + value).join('\n') + '\n',
          );
          console.log('Specs selected: ' + selected.size + ' / ' + existingSpecs.length);
          console.log('Selected platform: ' + platformInput);
          console.log('Lane 1 blocks: ' + lanes.lane1.length);
          console.log('Lane 2 blocks: ' + lanes.lane2.length);
          NODE

  e2e-regression:
    name: "REGRESSION lane 1 (${{ matrix.platform }}) - ${{ matrix.block }}"
    needs: setup-regression
    if: needs.setup-regression.result == 'success' && needs.setup-regression.outputs.lane1_count != '0'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.lane1_matrix) }}
    env:
      WDIO_MAX_INSTANCES: "1"
      REGRESSION_SPECS: ${{ matrix.specs }}
      AUTO_TOP_UP_EDIT_RULE_A11Y: ${{ vars.AUTO_TOP_UP_EDIT_RULE_A11Y }}
      AUTO_TOP_UP_TEST_SECOND_CURRENCY: ${{ vars.AUTO_TOP_UP_TEST_SECOND_CURRENCY }}
      AUTO_TOP_UP_TEST_MIN_AMOUNT: ${{ vars.AUTO_TOP_UP_TEST_MIN_AMOUNT }}
      AUTO_TOP_UP_TEST_MAX_AMOUNT: ${{ vars.AUTO_TOP_UP_TEST_MAX_AMOUNT }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      MB_ROG_PHONE: ${{ secrets.MB_ROG_PHONE }}
      MB_ROG_PIN: ${{ secrets.MB_ROG_PIN }}
      MB_LAZ_PHONE: ${{ secrets.MB_LAZ_PHONE }}
      MB_LAZ_PIN: ${{ secrets.MB_LAZ_PIN }}
      MB_MUM_PHONE: ${{ secrets.MB_MUM_PHONE }}
      MB_MUM_PIN: ${{ secrets.MB_MUM_PIN }}
      MB_POP_PHONE: ${{ secrets.MB_POP_PHONE }}
      MB_POP_PIN: ${{ secrets.MB_POP_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      AUTH_RECOVERY_MB_PHONE: ${{ secrets.AUTH_RECOVERY_MB_PHONE }}
      PD_MB_PHONE: ${{ secrets.PD_MB_PHONE }}
      PD_MB_PIN: ${{ secrets.PD_MB_PIN }}
      PD_OTP_PHONE: ${{ secrets.PD_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.platform }},regression,lane1
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      # MB_AUTH_SLOT stays unset: wdio.conf.ts picks each spec's account from regressionAccounts.json.
      - name: Run tests
        shell: bash
        run: |
          IFS=',' read -r -a specs <<< "$REGRESSION_SPECS"
          npm run wdio -- --spec "${specs[@]}"

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-lane1-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-regression-secondary:
    name: "REGRESSION lane 2 (${{ matrix.platform }}) - ${{ matrix.block }}"
    needs: setup-regression
    if: needs.setup-regression.result == 'success' && needs.setup-regression.outputs.lane2_count != '0'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.lane2_matrix) }}
    env:
      WDIO_MAX_INSTANCES: "1"
      REGRESSION_SPECS: ${{ matrix.specs }}
      AUTO_TOP_UP_EDIT_RULE_A11Y: ${{ vars.AUTO_TOP_UP_EDIT_RULE_A11Y }}
      AUTO_TOP_UP_TEST_SECOND_CURRENCY: ${{ vars.AUTO_TOP_UP_TEST_SECOND_CURRENCY }}
      AUTO_TOP_UP_TEST_MIN_AMOUNT: ${{ vars.AUTO_TOP_UP_TEST_MIN_AMOUNT }}
      AUTO_TOP_UP_TEST_MAX_AMOUNT: ${{ vars.AUTO_TOP_UP_TEST_MAX_AMOUNT }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      MB_ROG_PHONE: ${{ secrets.MB_ROG_PHONE }}
      MB_ROG_PIN: ${{ secrets.MB_ROG_PIN }}
      MB_LAZ_PHONE: ${{ secrets.MB_LAZ_PHONE }}
      MB_LAZ_PIN: ${{ secrets.MB_LAZ_PIN }}
      MB_MUM_PHONE: ${{ secrets.MB_MUM_PHONE }}
      MB_MUM_PIN: ${{ secrets.MB_MUM_PIN }}
      MB_POP_PHONE: ${{ secrets.MB_POP_PHONE }}
      MB_POP_PIN: ${{ secrets.MB_POP_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      AUTH_RECOVERY_MB_PHONE: ${{ secrets.AUTH_RECOVERY_MB_PHONE }}
      PD_MB_PHONE: ${{ secrets.PD_MB_PHONE }}
      PD_MB_PIN: ${{ secrets.PD_MB_PIN }}
      PD_OTP_PHONE: ${{ secrets.PD_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.platform }},regression,lane2
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      # MB_AUTH_SLOT stays unset: wdio.conf.ts picks each spec's account from regressionAccounts.json.
      - name: Run tests
        shell: bash
        run: |
          IFS=',' read -r -a specs <<< "$REGRESSION_SPECS"
          npm run wdio -- --spec "${specs[@]}"

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-lane2-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  sync-jira:
    name: Sync failures to JIRA
    runs-on: arc-runner-mb-deploy-stg-scale-set
    needs: [setup-regression, e2e-regression, e2e-regression-secondary]
    if: always() && needs.setup-regression.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Sync failures to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          ALLURE_RESULTS_DIR: ./allure-results
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ISSUES_PER_RUN: "15"
          DRY_RUN: "false"
        run: |
          echo "=== JIRA SYNC: START ==="
          node scripts/allure-jira-sync/sync-allure-to-jira.cjs 2>&1 | tee jira-sync.log
          echo "=== JIRA SYNC: END (exit code ${PIPESTATUS[0]}) ==="

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-sync-log
          path: jira-sync.log
          if-no-files-found: warn

  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [setup-regression, e2e-regression, e2e-regression-secondary]
    if: always() && needs.setup-regression.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Generate combined Allure report
        run: |
          npx -y allure-commandline@2 generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
