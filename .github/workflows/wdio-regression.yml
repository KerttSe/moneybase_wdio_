# Manual regression run: choose platform and category checkboxes.
name: WDIO Regression

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      bs_app_ios:
        description: "BrowserStack iOS app id (bs://...). Overrides BS_APP_IOS secret."
        required: false
        type: string
      bs_app_android:
        description: "BrowserStack Android app id (bs://...). Overrides BS_APP_ANDROID secret."
        required: false
        type: string
      home_navigation:
        description: "Home & Navigation"
        required: false
        default: true
        type: boolean
      bank_transfers:
        description: "Bank Transfers & Beneficiaries"
        required: false
        default: true
        type: boolean
      payments:
        description: "Payments, Top-ups & FX"
        required: false
        default: true
        type: boolean
      cards:
        description: "Business, Personal & Joint Cards"
        required: false
        default: true
        type: boolean
      invest:
        description: "Invest"
        required: false
        default: true
        type: boolean
      authentication:
        description: "Authentication"
        required: false
        default: true
        type: boolean
      onboarding_account:
        description: "Onboarding, Personal Details & Price Plans"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  setup-regression:
    name: Build regression blocks
    runs-on: arc-runner-mb-deploy-stg-scale-set
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      primary_matrix: ${{ steps.build.outputs.primary_matrix }}
      secondary_matrix: ${{ steps.build.outputs.secondary_matrix }}
      primary_count: ${{ steps.build.outputs.primary_count }}
      secondary_count: ${{ steps.build.outputs.secondary_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build selected category blocks
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
          ALL_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const inputs = JSON.parse(process.env.ALL_INPUTS_JSON || '{}');
          // Preserve the existing account lanes within every category.
          const categories = {
            home_navigation: {
              name: 'Home & Navigation',
              primary: [
                'launch.spec.ts',
                'homeSearch.spec.ts',
                'homeSpendAnalytics.spec.ts',
                'homeStoryly.spec.ts',
              ],
              secondary: [
                'homeScreen.spec.ts',
                'homeAccountSwitch.spec.ts',
              ],
            },
            bank_transfers: {
              name: 'Bank Transfers & Beneficiaries',
              primary: [
                'addFundsBankTransferWalletManager.spec.ts',
                'bankTransfer.business.spec.ts',
                'bankTransfer.p2p.individual.spec.ts',
                'bankTransfer.sepa.individual.spec.ts',
                'bankTransfer.swift.individual.spec.ts',
                'crossBorder.swift.retail.spec.ts',
                'vop.beneficiary.spec.ts',
                'vop.sepa.spec.ts',
              ],
              secondary: [
                'addbeneficiary.individual.spec.ts',
                'addbeneficiary.individual.usd.steps.spec.ts',
                'addbeneficiary.individual.usBicSwiftInvalid.spec.ts',
              ],
            },
            payments: {
              name: 'Payments, Top-ups & FX',
              primary: [
                'autoTopUp.spec.ts',
                'transactions.spec.ts',
              ],
              secondary: [
                'addfunds.spec.ts',
                'fxExchange.spec.ts',
                'fxExchange.regression.spec.ts',
                'salaryStipendPension.spec.ts',
              ],
            },
            cards: {
              name: 'Cards',
              primary: [
                'assignBusinessCard.spec.ts',
                'businessCard.adminSelfAssign.spec.ts',
                'businessCard.cardLimits.spec.ts',
                'cardFreezeUnfreeze.joint.spec.ts',
                'cardManagement.joint.spec.ts',
                'cardManagement.viewPin.spec.ts',
                'businessCard.noRights.spec.ts',
                'businessCard.walletReachOut.spec.ts',
              ],
              secondary: [
                'physicalcardcreation.spec.ts',
                'businessCard.freezeUnfreeze.otherPerson.spec.ts',
                'businessCard.terminate.spec.ts',
                'businessCard.relink.spec.ts',
              ],
            },
            invest: {
              name: 'Invest',
              primary: [
                'portfolio.spec.ts',
                'orders.spec.ts',
                'orders.regression.spec.ts',
                'priceAlerts.spec.ts',
              ],
              secondary: [
                'cashFunds.spec.ts',
                'watchlist.spec.ts',
              ],
            },
            authentication: {
              name: 'Authentication',
              primary: [],
              secondary: [
                'authentication.incorrectPasscode.spec.ts',
                'authentication.passcodeLockout.spec.ts',
                'authentication.otpCountdown.spec.ts',
              ],
            },
            onboarding_account: {
              name: 'Onboarding & Account',
              primary: [],
              secondary: [
                'personalDetails.spec.ts',
                'onboarding.spec.ts',
                'pricePlan.spec.ts',
              ],
            },
          };
          // Reject missing, duplicated or stale specs instead of silently reducing coverage.
          const mappedSpecs = Object.values(categories).flatMap(category =>
            [...category.primary, ...category.secondary].map(spec => 'src/tests/' + spec),
          );
          const existingSpecs = fs.readdirSync('src/tests', { recursive: true })
            .filter(spec => spec.endsWith('.spec.ts'))
            .map(spec => 'src/tests/' + spec.replaceAll('\\', '/'));
          const mappedSet = new Set(mappedSpecs);
          const existingSet = new Set(existingSpecs);
          const missing = existingSpecs.filter(spec => !mappedSet.has(spec));
          const stale = mappedSpecs.filter(spec => !existingSet.has(spec));
          if (missing.length || stale.length || mappedSet.size !== mappedSpecs.length) {
            throw new Error('Invalid regression coverage: ' + JSON.stringify({
              missing,
              stale,
              duplicates: mappedSpecs.filter((spec, index) => mappedSpecs.indexOf(spec) !== index),
            }));
          }
          const platformInput = process.env.PLATFORM_INPUT || 'all';
          if (!['all', 'android', 'ios'].includes(platformInput)) {
            throw new Error('Unsupported platform: ' + platformInput);
          }
          const platforms = platformInput === 'all' ? ['android', 'ios'] : [platformInput];
          const primary = [];
          const secondary = [];
          const summary = ['### Regression blocks selected', ''];
          let selectedSpecs = 0;
          let totalSpecs = 0;
          for (const [key, category] of Object.entries(categories)) {
            const count = category.primary.length + category.secondary.length;
            totalSpecs += count;
            const value = inputs[key];
            const selected = value == null || value === true || value === 'true';
            summary.push('- [' + (selected ? 'x' : ' ') + '] ' + category.name + ' (' + count + ' specs)');
            if (!selected) continue;
            selectedSpecs += count;
            for (const platform of platforms) {
              for (const authSlot of ['primary', 'secondary']) {
                const specs = category[authSlot];
                if (specs.length === 0) continue;
                const entry = {
                  platform,
                  category: category.name,
                  categoryKey: key,
                  specs: specs.map(spec => 'src/tests/' + spec).join(','),
                  smoke: false,
                  authSlot,
                };
                (authSlot === 'primary' ? primary : secondary).push(entry);
              }
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          if (selectedSpecs === 0) {
            throw new Error('Select at least one regression category.');
          }
          const outputs = {
            matrix: JSON.stringify({ include: [...primary, ...secondary] }),
            primary_matrix: JSON.stringify({ include: primary }),
            secondary_matrix: JSON.stringify({ include: secondary }),
            primary_count: primary.length,
            secondary_count: secondary.length,
          };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(outputs).map(([key, value]) => key + '=' + value).join('\n') + '\n',
          );
          console.log('Specs selected: ' + selectedSpecs + ' / ' + totalSpecs);
          console.log('Selected platform: ' + platformInput);
          console.log('Primary blocks: ' + primary.length);
          console.log('Secondary blocks: ' + secondary.length);
          NODE

  e2e-regression:
    name: "REGRESSION primary (${{ matrix.platform }}) - ${{ matrix.category }}"
    needs: setup-regression
    if: needs.setup-regression.result == 'success' && needs.setup-regression.outputs.primary_count != '0'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.primary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      WDIO_MAX_INSTANCES: "1"
      REGRESSION_SPECS: ${{ matrix.specs }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.categoryKey }},${{ matrix.platform }},regression
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        if: env.AUTH_SECURITY_MB_PHONE == ''
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        shell: bash
        run: |
          IFS=',' read -r -a specs <<< "$REGRESSION_SPECS"
          npm run wdio -- --spec "${specs[@]}"

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-regression-secondary:
    name: "REGRESSION secondary (${{ matrix.platform }}) - ${{ matrix.category }}"
    needs: setup-regression
    if: needs.setup-regression.result == 'success' && needs.setup-regression.outputs.secondary_count != '0'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.secondary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      WDIO_MAX_INSTANCES: "1"
      REGRESSION_SPECS: ${{ matrix.specs }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.categoryKey }},${{ matrix.platform }},regression,secondary
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ADD_BENEFICIARY_LOGIN_USE_API_OTP: "false"
      PHYSICAL_CARD_LOGIN_USE_API_OTP: "false"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-secondary-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        shell: bash
        run: |
          IFS=',' read -r -a specs <<< "$REGRESSION_SPECS"
          npm run wdio -- --spec "${specs[@]}"

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  sync-jira:
    name: Sync failures to JIRA
    runs-on: arc-runner-mb-deploy-stg-scale-set
    needs: [setup-regression, e2e-regression, e2e-regression-secondary]
    if: always() && needs.setup-regression.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Sync failures to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          ALLURE_RESULTS_DIR: ./allure-results
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ISSUES_PER_RUN: "15"
          DRY_RUN: "false"
        run: |
          echo "=== JIRA SYNC: START ==="
          node scripts/allure-jira-sync/sync-allure-to-jira.cjs 2>&1 | tee jira-sync.log
          echo "=== JIRA SYNC: END (exit code ${PIPESTATUS[0]}) ==="

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-sync-log
          path: jira-sync.log
          if-no-files-found: warn

  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [setup-regression, e2e-regression, e2e-regression-secondary]
    if: always() && needs.setup-regression.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Generate combined Allure report
        run: |
          npx -y allure-commandline@2 generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
