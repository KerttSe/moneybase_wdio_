# Manual regression run — pick platform and tick/untick individual spec checkboxes below.
name: WDIO Regression

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      bs_app_ios:
        description: "BrowserStack iOS app id (bs://...). Overrides BS_APP_IOS secret."
        required: false
        type: string
      bs_app_android:
        description: "BrowserStack Android app id (bs://...). Overrides BS_APP_ANDROID secret."
        required: false
        type: string
      # --- Home & Navigation ---
      spec_launch:
        description: "[Home & Navigation] launch.spec.ts"
        required: false
        default: true
        type: boolean
      spec_homeSearch:
        description: "[Home & Navigation] homeSearch.spec.ts"
        required: false
        default: true
        type: boolean
      spec_homeSpendAnalytics:
        description: "[Home & Navigation] homeSpendAnalytics.spec.ts"
        required: false
        default: true
        type: boolean
      spec_homeStoryly:
        description: "[Home & Navigation] homeStoryly.spec.ts"
        required: false
        default: true
        type: boolean
      spec_homeScreen:
        description: "[Home & Navigation] homeScreen.spec.ts"
        required: false
        default: true
        type: boolean
      spec_homeAccountSwitch:
        description: "[Home & Navigation] homeAccountSwitch.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Bank Transfers ---
      spec_addFundsBankTransferWalletManager:
        description: "[Bank Transfers] addFundsBankTransferWalletManager.spec.ts"
        required: false
        default: true
        type: boolean
      spec_bankTransferP2p:
        description: "[Bank Transfers] bankTransfer.p2p.individual.spec.ts"
        required: false
        default: true
        type: boolean
      spec_bankTransferSepa:
        description: "[Bank Transfers] bankTransfer.sepa.individual.spec.ts"
        required: false
        default: true
        type: boolean
      spec_bankTransferSwift:
        description: "[Bank Transfers] bankTransfer.swift.individual.spec.ts"
        required: false
        default: true
        type: boolean
      spec_crossBorderSwiftRetail:
        description: "[Bank Transfers] crossBorder.swift.retail.spec.ts"
        required: false
        default: true
        type: boolean
      spec_vopBeneficiary:
        description: "[Bank Transfers] vop.beneficiary.spec.ts"
        required: false
        default: true
        type: boolean
      spec_vopSepa:
        description: "[Bank Transfers] vop.sepa.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Beneficiaries & Funds ---
      spec_addbeneficiaryIndividual:
        description: "[Beneficiaries & Funds] addbeneficiary.individual.spec.ts"
        required: false
        default: true
        type: boolean
      spec_addbeneficiaryIndividualUsd:
        description: "[Beneficiaries & Funds] addbeneficiary.individual.usd.steps.spec.ts"
        required: false
        default: true
        type: boolean
      spec_addfunds:
        description: "[Beneficiaries & Funds] addfunds.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Business Cards ---
      spec_assignBusinessCard:
        description: "[Business Cards] assignBusinessCard.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardAdminSelfAssign:
        description: "[Business Cards] businessCard.adminSelfAssign.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardCardLimits:
        description: "[Business Cards] businessCard.cardLimits.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardNoRights:
        description: "[Business Cards] businessCard.noRights.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardWalletReachOut:
        description: "[Business Cards] businessCard.walletReachOut.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardFreezeUnfreezeOtherPerson:
        description: "[Business Cards] businessCard.freezeUnfreeze.otherPerson.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardTerminate:
        description: "[Business Cards] businessCard.terminate.spec.ts"
        required: false
        default: true
        type: boolean
      spec_businessCardRelink:
        description: "[Business Cards] businessCard.relink.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Personal / Joint Cards ---
      spec_cardFreezeUnfreezeJoint:
        description: "[Personal / Joint Cards] cardFreezeUnfreeze.joint.spec.ts"
        required: false
        default: true
        type: boolean
      spec_cardManagementJoint:
        description: "[Personal / Joint Cards] cardManagement.joint.spec.ts"
        required: false
        default: true
        type: boolean
      spec_physicalcardcreation:
        description: "[Personal / Joint Cards] physicalcardcreation.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Invest ---
      spec_portfolio:
        description: "[Invest] portfolio.spec.ts"
        required: false
        default: true
        type: boolean
      spec_orders:
        description: "[Invest] orders.spec.ts"
        required: false
        default: true
        type: boolean
      spec_ordersRegression:
        description: "[Invest] orders.regression.spec.ts"
        required: false
        default: true
        type: boolean
      spec_priceAlerts:
        description: "[Invest] priceAlerts.spec.ts"
        required: false
        default: true
        type: boolean
      spec_watchlist:
        description: "[Invest] watchlist.spec.ts"
        required: false
        default: true
        type: boolean
      spec_fxExchange:
        description: "[Invest] fxExchange.spec.ts"
        required: false
        default: true
        type: boolean
      spec_fxExchangeRegression:
        description: "[Invest] fxExchange.regression.spec.ts"
        required: false
        default: true
        type: boolean
      spec_cashFunds:
        description: "[Invest] cashFunds.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Authentication ---
      spec_authIncorrectPasscode:
        description: "[Authentication] authentication.incorrectPasscode.spec.ts"
        required: false
        default: true
        type: boolean
      spec_authPasscodeLockout:
        description: "[Authentication] authentication.passcodeLockout.spec.ts"
        required: false
        default: true
        type: boolean
      spec_authOtpCountdown:
        description: "[Authentication] authentication.otpCountdown.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Onboarding & Personal Details ---
      spec_onboarding:
        description: "[Onboarding & Personal Details] onboarding.spec.ts"
        required: false
        default: true
        type: boolean
      spec_personalDetails:
        description: "[Onboarding & Personal Details] personalDetails.spec.ts"
        required: false
        default: true
        type: boolean
      # --- Account & Misc ---
      spec_autoTopUp:
        description: "[Account & Misc] autoTopUp.spec.ts"
        required: false
        default: true
        type: boolean
      spec_transactions:
        description: "[Account & Misc] transactions.spec.ts"
        required: false
        default: true
        type: boolean
      spec_pricePlan:
        description: "[Account & Misc] pricePlan.spec.ts"
        required: false
        default: true
        type: boolean
      spec_salaryStipendPension:
        description: "[Account & Misc] salaryStipendPension.spec.ts"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  setup-regression:
    name: Build regression matrix
    runs-on: arc-runner-mb-deploy-stg-scale-set
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      primary_matrix: ${{ steps.build.outputs.primary_matrix }}
      secondary_matrix: ${{ steps.build.outputs.secondary_matrix }}
    steps:
      - name: Build regression matrix filtered by platform
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
          ALL_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          # Lane 1 — primary account (VEG40002): account-specific + agnostic Individual
          PRIMARY_SPECS=(
            "src/tests/launch.spec.ts"
            "src/tests/homeSearch.spec.ts"
            "src/tests/homeSpendAnalytics.spec.ts"
            "src/tests/homeStoryly.spec.ts"
            "src/tests/addFundsBankTransferWalletManager.spec.ts"
            "src/tests/assignBusinessCard.spec.ts"
            "src/tests/businessCard.adminSelfAssign.spec.ts"
            "src/tests/businessCard.cardLimits.spec.ts"
            "src/tests/cardFreezeUnfreeze.joint.spec.ts"
            "src/tests/cardManagement.joint.spec.ts"
            "src/tests/autoTopUp.spec.ts"
            "src/tests/transactions.spec.ts"
            "src/tests/bankTransfer.p2p.individual.spec.ts"
            "src/tests/bankTransfer.sepa.individual.spec.ts"
            "src/tests/bankTransfer.swift.individual.spec.ts"
            "src/tests/portfolio.spec.ts"
            "src/tests/orders.spec.ts"
            "src/tests/businessCard.noRights.spec.ts"
            "src/tests/businessCard.walletReachOut.spec.ts"
            "src/tests/crossBorder.swift.retail.spec.ts"
            "src/tests/orders.regression.spec.ts"
            "src/tests/priceAlerts.spec.ts"
            "src/tests/vop.beneficiary.spec.ts"
            "src/tests/vop.sepa.spec.ts"
          )

          # Lane 2 — secondary (KER40014) + dedicated isolated accounts (AUTH_SECURITY, AUTH_OTP, BH)
          # Dedicated-account specs use their own env vars — authSlot value is irrelevant for them
          SECONDARY_SPECS=(
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/addbeneficiary.individual.usd.steps.spec.ts"
            "src/tests/personalDetails.spec.ts"
            "src/tests/onboarding.spec.ts"
            "src/tests/authentication.incorrectPasscode.spec.ts"
            "src/tests/authentication.passcodeLockout.spec.ts"
            "src/tests/authentication.otpCountdown.spec.ts"
            "src/tests/fxExchange.regression.spec.ts"
            "src/tests/businessCard.freezeUnfreeze.otherPerson.spec.ts"
            "src/tests/businessCard.terminate.spec.ts"
            "src/tests/businessCard.relink.spec.ts"
            "src/tests/pricePlan.spec.ts"
            "src/tests/salaryStipendPension.spec.ts"
          )

          PLATFORMS=()
          case "$PLATFORM_INPUT" in
            android) PLATFORMS=("android") ;;
            ios)     PLATFORMS=("ios") ;;
            *)       PLATFORMS=("android" "ios") ;;
          esac

          # Each regression spec has its own checkbox in workflow_dispatch (spec_xxx).
          # Unchecking one drops that spec from both lanes; default is true (full matrix).
          declare -A SPEC_INPUT_KEY=(
            ["src/tests/launch.spec.ts"]="spec_launch"
            ["src/tests/homeSearch.spec.ts"]="spec_homeSearch"
            ["src/tests/homeSpendAnalytics.spec.ts"]="spec_homeSpendAnalytics"
            ["src/tests/homeStoryly.spec.ts"]="spec_homeStoryly"
            ["src/tests/homeScreen.spec.ts"]="spec_homeScreen"
            ["src/tests/homeAccountSwitch.spec.ts"]="spec_homeAccountSwitch"

            ["src/tests/addFundsBankTransferWalletManager.spec.ts"]="spec_addFundsBankTransferWalletManager"
            ["src/tests/bankTransfer.p2p.individual.spec.ts"]="spec_bankTransferP2p"
            ["src/tests/bankTransfer.sepa.individual.spec.ts"]="spec_bankTransferSepa"
            ["src/tests/bankTransfer.swift.individual.spec.ts"]="spec_bankTransferSwift"
            ["src/tests/crossBorder.swift.retail.spec.ts"]="spec_crossBorderSwiftRetail"
            ["src/tests/vop.beneficiary.spec.ts"]="spec_vopBeneficiary"
            ["src/tests/vop.sepa.spec.ts"]="spec_vopSepa"

            ["src/tests/addbeneficiary.individual.spec.ts"]="spec_addbeneficiaryIndividual"
            ["src/tests/addbeneficiary.individual.usd.steps.spec.ts"]="spec_addbeneficiaryIndividualUsd"
            ["src/tests/addfunds.spec.ts"]="spec_addfunds"

            ["src/tests/assignBusinessCard.spec.ts"]="spec_assignBusinessCard"
            ["src/tests/businessCard.adminSelfAssign.spec.ts"]="spec_businessCardAdminSelfAssign"
            ["src/tests/businessCard.cardLimits.spec.ts"]="spec_businessCardCardLimits"
            ["src/tests/businessCard.noRights.spec.ts"]="spec_businessCardNoRights"
            ["src/tests/businessCard.walletReachOut.spec.ts"]="spec_businessCardWalletReachOut"
            ["src/tests/businessCard.freezeUnfreeze.otherPerson.spec.ts"]="spec_businessCardFreezeUnfreezeOtherPerson"
            ["src/tests/businessCard.terminate.spec.ts"]="spec_businessCardTerminate"
            ["src/tests/businessCard.relink.spec.ts"]="spec_businessCardRelink"

            ["src/tests/cardFreezeUnfreeze.joint.spec.ts"]="spec_cardFreezeUnfreezeJoint"
            ["src/tests/cardManagement.joint.spec.ts"]="spec_cardManagementJoint"
            ["src/tests/physicalcardcreation.spec.ts"]="spec_physicalcardcreation"

            ["src/tests/portfolio.spec.ts"]="spec_portfolio"
            ["src/tests/orders.spec.ts"]="spec_orders"
            ["src/tests/orders.regression.spec.ts"]="spec_ordersRegression"
            ["src/tests/priceAlerts.spec.ts"]="spec_priceAlerts"
            ["src/tests/watchlist.spec.ts"]="spec_watchlist"
            ["src/tests/fxExchange.spec.ts"]="spec_fxExchange"
            ["src/tests/fxExchange.regression.spec.ts"]="spec_fxExchangeRegression"
            ["src/tests/cashFunds.spec.ts"]="spec_cashFunds"

            ["src/tests/authentication.incorrectPasscode.spec.ts"]="spec_authIncorrectPasscode"
            ["src/tests/authentication.passcodeLockout.spec.ts"]="spec_authPasscodeLockout"
            ["src/tests/authentication.otpCountdown.spec.ts"]="spec_authOtpCountdown"

            ["src/tests/onboarding.spec.ts"]="spec_onboarding"
            ["src/tests/personalDetails.spec.ts"]="spec_personalDetails"

            ["src/tests/autoTopUp.spec.ts"]="spec_autoTopUp"
            ["src/tests/transactions.spec.ts"]="spec_transactions"
            ["src/tests/pricePlan.spec.ts"]="spec_pricePlan"
            ["src/tests/salaryStipendPension.spec.ts"]="spec_salaryStipendPension"
          )

          spec_checked() {
            local spec="$1"
            local key="${SPEC_INPUT_KEY[$spec]}"
            if [[ -z "$key" ]]; then
              echo "::warning::Spec has no checkbox mapping, including it by default: $spec"
              return 0
            fi
            local value
            value=$(echo "$ALL_INPUTS_JSON" | jq -r --arg k "$key" '.[$k] // "true"')
            [[ "$value" == "true" ]]
          }

          NEW_PRIMARY=()
          for spec in "${PRIMARY_SPECS[@]}"; do
            spec_checked "$spec" && NEW_PRIMARY+=("$spec")
          done
          PRIMARY_SPECS=("${NEW_PRIMARY[@]}")

          NEW_SECONDARY=()
          for spec in "${SECONDARY_SPECS[@]}"; do
            spec_checked "$spec" && NEW_SECONDARY+=("$spec")
          done
          SECONDARY_SPECS=("${NEW_SECONDARY[@]}")

          {
            echo "### Regression specs selected"
            echo ""
            for spec in "${!SPEC_INPUT_KEY[@]}"; do
              name=$(basename "$spec")
              found=false
              for s in "${PRIMARY_SPECS[@]}" "${SECONDARY_SPECS[@]}"; do
                [[ "$s" == "$spec" ]] && found=true && break
              done
              if [[ "$found" == "true" ]]; then
                echo "- ✅ $name"
              else
                echo "- ⬜ $name"
              fi
            done | sort
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Specs selected: $(( ${#PRIMARY_SPECS[@]} + ${#SECONDARY_SPECS[@]} )) / ${#SPEC_INPUT_KEY[@]}"

          INCLUDE="[]"
          PRIMARY_INCLUDE="[]"
          SECONDARY_INCLUDE="[]"

          for platform in "${PLATFORMS[@]}"; do
            for spec in "${PRIMARY_SPECS[@]}"; do
              entry=$(jq -c -n --arg p "$platform" --arg s "$spec" \
                '{"platform": $p, "spec": $s, "smoke": false, "authSlot": "primary"}')
              INCLUDE=$(echo "$INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
              PRIMARY_INCLUDE=$(echo "$PRIMARY_INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
            done
            for spec in "${SECONDARY_SPECS[@]}"; do
              entry=$(jq -c -n --arg p "$platform" --arg s "$spec" \
                '{"platform": $p, "spec": $s, "smoke": false, "authSlot": "secondary"}')
              INCLUDE=$(echo "$INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
              SECONDARY_INCLUDE=$(echo "$SECONDARY_INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
            done
          done

          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{"include": $inc}')
          PRIMARY_MATRIX=$(jq -c -n --argjson inc "$PRIMARY_INCLUDE" '{"include": $inc}')
          SECONDARY_MATRIX=$(jq -c -n --argjson inc "$SECONDARY_INCLUDE" '{"include": $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "primary_matrix=$PRIMARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "secondary_matrix=$SECONDARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $PLATFORM_INPUT"
          echo "Primary jobs: $(echo "$PRIMARY_INCLUDE" | jq 'length')"
          echo "Secondary jobs: $(echo "$SECONDARY_INCLUDE" | jq 'length')"

  e2e-regression:
    name: "REGRESSION parallel 1 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-regression
    if: needs.setup-regression.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.primary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},regression
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        if: env.AUTH_SECURITY_MB_PHONE == ''
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-regression-secondary:
    name: "REGRESSION parallel 2 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-regression
    if: needs.setup-regression.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.secondary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},regression,secondary
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ADD_BENEFICIARY_LOGIN_USE_API_OTP: "false"
      PHYSICAL_CARD_LOGIN_USE_API_OTP: "false"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-secondary-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  sync-jira:
    name: Sync failures to JIRA
    runs-on: arc-runner-mb-deploy-stg-scale-set
    needs: [e2e-regression, e2e-regression-secondary]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Sync failures to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          ALLURE_RESULTS_DIR: ./allure-results
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ISSUES_PER_RUN: "15"
          DRY_RUN: "false"
        run: |
          echo "=== JIRA SYNC: START ==="
          node scripts/allure-jira-sync/sync-allure-to-jira.cjs 2>&1 | tee jira-sync.log
          echo "=== JIRA SYNC: END (exit code ${PIPESTATUS[0]}) ==="

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-sync-log
          path: jira-sync.log
          if-no-files-found: warn

  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [e2e-regression, e2e-regression-secondary]
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Generate combined Allure report
        run: |
          npx -y allure-commandline@2 generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
