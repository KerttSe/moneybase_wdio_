name: WDIO E2E

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      suite:
        description: Test suite to run
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - all
      bs_app_ios:
        description: "BrowserStack iOS app id (bs://...). Overrides BS_APP_IOS secret."
        required: false
        type: string
      bs_app_android:
        description: "BrowserStack Android app id (bs://...). Overrides BS_APP_ANDROID secret."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # SMOKE
  # ---------------------------------------------------------------------
  setup-smoke:
    name: Build smoke matrix
    runs-on: arc-runner-mb-deploy-stg-scale-set
    if: (github.event.inputs.suite || 'smoke') == 'smoke' || (github.event.inputs.suite || 'smoke') == 'all'
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      primary_matrix: ${{ steps.build.outputs.primary_matrix }}
      secondary_matrix: ${{ steps.build.outputs.secondary_matrix }}
    steps:
      - name: Build smoke matrix filtered by platform
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
        run: |
          SPECS=(
            "src/tests/launch.spec.ts"
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/homeSearch.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/cardFreezeUnfreeze.joint.spec.ts"
            "src/tests/bankTransfer.p2p.individual.spec.ts"
            "src/tests/bankTransfer.sepa.individual.spec.ts"
            "src/tests/bankTransfer.swift.individual.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/autoTopUp.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/portfolio.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/orders.spec.ts"
            "src/tests/priceAlerts.spec.ts"
            "src/tests/onboarding.spec.ts"
          )

          PLATFORMS=()
          case "$PLATFORM_INPUT" in
            android) PLATFORMS=("android") ;;
            ios)     PLATFORMS=("ios") ;;
            *)       PLATFORMS=("android" "ios") ;;
          esac

          SECONDARY_SPECS=(
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/onboarding.spec.ts"
          )

          is_secondary_spec() {
            local target="$1"
            for secondary in "${SECONDARY_SPECS[@]}"; do
              [[ "$target" == "$secondary" ]] && return 0
            done
            return 1
          }

          INCLUDE="[]"
          PRIMARY_INCLUDE="[]"
          SECONDARY_INCLUDE="[]"
          for platform in "${PLATFORMS[@]}"; do
            for spec in "${SPECS[@]}"; do
              INCLUDE=$(echo "$INCLUDE" | jq -c \
                --arg p "$platform" --arg s "$spec" \
                '. += [{"platform": $p, "spec": $s, "smoke": true}]')
              if is_secondary_spec "$spec"; then
                SECONDARY_INCLUDE=$(echo "$SECONDARY_INCLUDE" | jq -c \
                  --arg p "$platform" --arg s "$spec" \
                  '. += [{"platform": $p, "spec": $s, "smoke": true, "authSlot": "secondary"}]')
              else
                PRIMARY_INCLUDE=$(echo "$PRIMARY_INCLUDE" | jq -c \
                  --arg p "$platform" --arg s "$spec" \
                  '. += [{"platform": $p, "spec": $s, "smoke": true, "authSlot": "primary"}]')
              fi
            done
          done

          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{"include": $inc}')
          PRIMARY_MATRIX=$(jq -c -n --argjson inc "$PRIMARY_INCLUDE" '{"include": $inc}')
          SECONDARY_MATRIX=$(jq -c -n --argjson inc "$SECONDARY_INCLUDE" '{"include": $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "primary_matrix=$PRIMARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "secondary_matrix=$SECONDARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $PLATFORM_INPUT"
          echo "Jobs to create: $(echo "$INCLUDE" | jq 'length')"
          echo "Primary jobs: $(echo "$PRIMARY_INCLUDE" | jq 'length')"
          echo "Secondary jobs: $(echo "$SECONDARY_INCLUDE" | jq 'length')"

  e2e-smoke:
    name: "[Lane 1] SMOKE (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-smoke
    if: needs.setup-smoke.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-smoke.outputs.primary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},smoke
      BS_MAX_INSTANCES: "1"
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload onboarded accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-accounts-smoke-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: .generated/onboarded-accounts.json
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-smoke-secondary:
    name: "[Lane 2] SMOKE secondary (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-smoke
    if: needs.setup-smoke.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-smoke.outputs.secondary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      MB_ALT_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      MB_ALT_PHONE: ${{ secrets.BH_MB_PHONE }}
      MB_ALT_PIN: ${{ secrets.BH_MB_PIN }}
      MB_ALT_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},smoke,secondary
      BS_MAX_INSTANCES: "1"
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload onboarded accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-accounts-smoke-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: .generated/onboarded-accounts.json
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # REGRESSION
  # ---------------------------------------------------------------------
  setup-regression:
    name: Build regression matrix
    runs-on: arc-runner-mb-deploy-stg-scale-set
    if: (github.event.inputs.suite || 'smoke') == 'regression' || (github.event.inputs.suite || 'smoke') == 'all'
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build regression matrix filtered by platform
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
        run: |
          SPECS=(
            "src/tests/launch.spec.ts"
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/homeSearch.spec.ts"
            "src/tests/homeSpendAnalytics.spec.ts"
            "src/tests/homeStoryly.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/addFundsBankTransferWalletManager.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/addbeneficiary.individual.usd.steps.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/assignBusinessCard.spec.ts"
            "src/tests/cardFreezeUnfreeze.joint.spec.ts"
            "src/tests/cardManagement.joint.spec.ts"
            "src/tests/bankTransfer.p2p.individual.spec.ts"
            "src/tests/bankTransfer.sepa.individual.spec.ts"
            "src/tests/bankTransfer.swift.individual.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/autoTopUp.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/portfolio.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/orders.spec.ts"
            "src/tests/priceAlerts.spec.ts"
            "src/tests/pricePlan.spec.ts"
            "src/tests/salaryStipendPension.spec.ts"
            "src/tests/threeDS2.spec.ts"
            "src/tests/transactions.spec.ts"
            "src/tests/onboarding.spec.ts"
            "src/tests/authentication.incorrectPasscode.spec.ts"
            "src/tests/authentication.passcodeLockout.spec.ts"
            "src/tests/authentication.otpCountdown.spec.ts"
            "src/tests/businessCard.freezeUnfreeze.otherPerson.spec.ts"
            "src/tests/businessCard.terminate.spec.ts"
            "src/tests/businessCard.relink.spec.ts"
          )

          PLATFORMS=()
          case "$PLATFORM_INPUT" in
            android) PLATFORMS=("android") ;;
            ios)     PLATFORMS=("ios") ;;
            *)       PLATFORMS=("android" "ios") ;;
          esac

          INCLUDE="[]"
          for platform in "${PLATFORMS[@]}"; do
            for spec in "${SPECS[@]}"; do
              INCLUDE=$(echo "$INCLUDE" | jq -c \
                --arg p "$platform" --arg s "$spec" \
                '. += [{"platform": $p, "spec": $s, "smoke": false}]')
            done
          done

          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{"include": $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $PLATFORM_INPUT"
          echo "Jobs to create: $(echo "$INCLUDE" | jq 'length')"

  e2e-regression:
    name: REGRESSION (${{ matrix.platform }}) — ${{ matrix.spec }}
    # Waits on both smoke lanes so that when suite=all is selected, regression only
    # starts once the smoke matrix has finished (sequential, not parallel —
    # avoids hitting the test account with two suites at once). Regression
    # runs whether smoke passed or failed — it is only gated on smoke being
    # DONE, not on smoke succeeding.
    # If suite=regression is selected on its own, smoke jobs never ran (they're
    # skipped), so this still lets you fire regression standalone/manually.
    needs: [setup-regression, e2e-smoke, e2e-smoke-secondary]
    if: >
      needs.setup-regression.result == 'success' &&
      (needs.e2e-smoke.result == 'success' || needs.e2e-smoke.result == 'failure' || needs.e2e-smoke.result == 'skipped') &&
      (needs.e2e-smoke-secondary.result == 'success' || needs.e2e-smoke-secondary.result == 'failure' || needs.e2e-smoke-secondary.result == 'skipped')
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.matrix) }}
    env:
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},regression
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        if: env.AUTH_SECURITY_MB_PHONE == ''
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # REPORT
  # ---------------------------------------------------------------------
  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-smoke-secondary, e2e-regression]
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Generate combined Allure report
        run: |
          npx -y allure-commandline@2 generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
