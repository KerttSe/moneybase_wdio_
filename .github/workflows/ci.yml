name: WDIO E2E

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      suite:
        description: Test suite to run
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - all
      bs_app_ios:
        description: "BrowserStack iOS app id (bs://...). Overrides BS_APP_IOS secret."
        required: false
        type: string
      bs_app_android:
        description: "BrowserStack Android app id (bs://...). Overrides BS_APP_ANDROID secret."
        required: false
        type: string
      regression_specs:
        description: "Comma-separated regression spec paths to run (overrides the checkpoint checkboxes below). Example: src/tests/fxExchange.spec.ts,src/tests/onboarding.spec.ts"
        required: false
        type: string
      checkpoint_home:
        description: "Checkpoint: Home & Navigation (launch, home search/spend analytics/storyly, account switch)"
        required: false
        default: true
        type: boolean
      checkpoint_payments:
        description: "Checkpoint: Payments & Transfers (bank transfers, cross-border, VOP, beneficiaries, add funds)"
        required: false
        default: true
        type: boolean
      checkpoint_cards:
        description: "Checkpoint: Cards (business + physical card management, freeze/unfreeze, limits, terminate/relink)"
        required: false
        default: true
        type: boolean
      checkpoint_invest:
        description: "Checkpoint: Invest (portfolio, orders, price alerts, watchlist, FX exchange, cash funds)"
        required: false
        default: true
        type: boolean
      checkpoint_auth_onboarding:
        description: "Checkpoint: Auth & Onboarding (onboarding, personal details, passcode/OTP auth)"
        required: false
        default: true
        type: boolean
      checkpoint_account_misc:
        description: "Checkpoint: Account & Misc (auto top-up, transactions, price plan, salary/stipend/pension)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # SMOKE
  # ---------------------------------------------------------------------
  setup-smoke:
    name: Build smoke matrix
    runs-on: arc-runner-mb-deploy-stg-scale-set
    if: (github.event.inputs.suite || 'smoke') == 'smoke' || (github.event.inputs.suite || 'smoke') == 'all'
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      primary_matrix: ${{ steps.build.outputs.primary_matrix }}
      secondary_matrix: ${{ steps.build.outputs.secondary_matrix }}
    steps:
      - name: Build smoke matrix filtered by platform
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
        run: |
          SPECS=(
            "src/tests/launch.spec.ts"
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/homeSearch.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/cardFreezeUnfreeze.joint.spec.ts"
            "src/tests/bankTransfer.p2p.individual.spec.ts"
            "src/tests/bankTransfer.sepa.individual.spec.ts"
            "src/tests/bankTransfer.swift.individual.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/autoTopUp.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/portfolio.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/orders.spec.ts"
            "src/tests/priceAlerts.spec.ts"
            "src/tests/onboarding.spec.ts"
          )

          PLATFORMS=()
          case "$PLATFORM_INPUT" in
            android) PLATFORMS=("android") ;;
            ios)     PLATFORMS=("ios") ;;
            *)       PLATFORMS=("android" "ios") ;;
          esac

          SECONDARY_SPECS=(
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/onboarding.spec.ts"
          )

          is_secondary_spec() {
            local target="$1"
            for secondary in "${SECONDARY_SPECS[@]}"; do
              [[ "$target" == "$secondary" ]] && return 0
            done
            return 1
          }

          INCLUDE="[]"
          PRIMARY_INCLUDE="[]"
          SECONDARY_INCLUDE="[]"
          for platform in "${PLATFORMS[@]}"; do
            for spec in "${SPECS[@]}"; do
              INCLUDE=$(echo "$INCLUDE" | jq -c \
                --arg p "$platform" --arg s "$spec" \
                '. += [{"platform": $p, "spec": $s, "smoke": true}]')
              if is_secondary_spec "$spec"; then
                SECONDARY_INCLUDE=$(echo "$SECONDARY_INCLUDE" | jq -c \
                  --arg p "$platform" --arg s "$spec" \
                  '. += [{"platform": $p, "spec": $s, "smoke": true, "authSlot": "secondary"}]')
              else
                PRIMARY_INCLUDE=$(echo "$PRIMARY_INCLUDE" | jq -c \
                  --arg p "$platform" --arg s "$spec" \
                  '. += [{"platform": $p, "spec": $s, "smoke": true, "authSlot": "primary"}]')
              fi
            done
          done

          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{"include": $inc}')
          PRIMARY_MATRIX=$(jq -c -n --argjson inc "$PRIMARY_INCLUDE" '{"include": $inc}')
          SECONDARY_MATRIX=$(jq -c -n --argjson inc "$SECONDARY_INCLUDE" '{"include": $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "primary_matrix=$PRIMARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "secondary_matrix=$SECONDARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $PLATFORM_INPUT"
          echo "Jobs to create: $(echo "$INCLUDE" | jq 'length')"
          echo "Primary jobs: $(echo "$PRIMARY_INCLUDE" | jq 'length')"
          echo "Secondary jobs: $(echo "$SECONDARY_INCLUDE" | jq 'length')"

  e2e-smoke:
    name: "SMOKE parallel 1 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-smoke
    if: needs.setup-smoke.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-smoke.outputs.primary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},smoke
      BS_MAX_INSTANCES: "1"
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload onboarded accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-accounts-smoke-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: .generated/onboarded-accounts.json
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-smoke-secondary:
    name: "SMOKE parallel 2 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-smoke
    if: needs.setup-smoke.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-smoke.outputs.secondary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},smoke,secondary
      BS_MAX_INSTANCES: "1"
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ADD_BENEFICIARY_LOGIN_USE_API_OTP: "false"
      PHYSICAL_CARD_LOGIN_USE_API_OTP: "false"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload onboarded accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-accounts-smoke-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: .generated/onboarded-accounts.json
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # REGRESSION
  # ---------------------------------------------------------------------
  setup-regression:
    name: Build regression matrix
    runs-on: arc-runner-mb-deploy-stg-scale-set
    if: (github.event.inputs.suite || 'smoke') == 'regression' || (github.event.inputs.suite || 'smoke') == 'all'
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      primary_matrix: ${{ steps.build.outputs.primary_matrix }}
      secondary_matrix: ${{ steps.build.outputs.secondary_matrix }}
    steps:
      - name: Build regression matrix filtered by platform
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
          REGRESSION_SPECS_INPUT: ${{ github.event.inputs.regression_specs }}
          CHECKPOINT_HOME: ${{ github.event.inputs.checkpoint_home || 'true' }}
          CHECKPOINT_PAYMENTS: ${{ github.event.inputs.checkpoint_payments || 'true' }}
          CHECKPOINT_CARDS: ${{ github.event.inputs.checkpoint_cards || 'true' }}
          CHECKPOINT_INVEST: ${{ github.event.inputs.checkpoint_invest || 'true' }}
          CHECKPOINT_AUTH_ONBOARDING: ${{ github.event.inputs.checkpoint_auth_onboarding || 'true' }}
          CHECKPOINT_ACCOUNT_MISC: ${{ github.event.inputs.checkpoint_account_misc || 'true' }}
        run: |
          # Lane 1 — primary account (VEG40002): account-specific + agnostic Individual
          PRIMARY_SPECS=(
            "src/tests/launch.spec.ts"
            "src/tests/homeSearch.spec.ts"
            "src/tests/homeSpendAnalytics.spec.ts"
            "src/tests/homeStoryly.spec.ts"
            "src/tests/addFundsBankTransferWalletManager.spec.ts"
            "src/tests/assignBusinessCard.spec.ts"
            "src/tests/businessCard.adminSelfAssign.spec.ts"
            "src/tests/businessCard.cardLimits.spec.ts"
            "src/tests/cardFreezeUnfreeze.joint.spec.ts"
            "src/tests/cardManagement.joint.spec.ts"
            "src/tests/autoTopUp.spec.ts"
            "src/tests/transactions.spec.ts"
            "src/tests/bankTransfer.p2p.individual.spec.ts"
            "src/tests/bankTransfer.sepa.individual.spec.ts"
            "src/tests/bankTransfer.swift.individual.spec.ts"
            "src/tests/portfolio.spec.ts"
            "src/tests/orders.spec.ts"
            "src/tests/businessCard.noRights.spec.ts"
            "src/tests/businessCard.walletReachOut.spec.ts"
            "src/tests/crossBorder.swift.retail.spec.ts"
            "src/tests/orders.regression.spec.ts"
            "src/tests/priceAlerts.spec.ts"
            "src/tests/vop.beneficiary.spec.ts"
            "src/tests/vop.sepa.spec.ts"
          )

          # Lane 2 — secondary (KER40014) + dedicated isolated accounts (AUTH_SECURITY, AUTH_OTP, BH)
          # Dedicated-account specs use their own env vars — authSlot value is irrelevant for them
          SECONDARY_SPECS=(
            "src/tests/homeScreen.spec.ts"
            "src/tests/homeAccountSwitch.spec.ts"
            "src/tests/addbeneficiary.individual.spec.ts"
            "src/tests/addfunds.spec.ts"
            "src/tests/cashFunds.spec.ts"
            "src/tests/physicalcardcreation.spec.ts"
            "src/tests/fxExchange.spec.ts"
            "src/tests/watchlist.spec.ts"
            "src/tests/addbeneficiary.individual.usd.steps.spec.ts"
            "src/tests/personalDetails.spec.ts"
            "src/tests/onboarding.spec.ts"
            "src/tests/authentication.incorrectPasscode.spec.ts"
            "src/tests/authentication.passcodeLockout.spec.ts"
            "src/tests/authentication.otpCountdown.spec.ts"
            "src/tests/fxExchange.regression.spec.ts"
            "src/tests/businessCard.freezeUnfreeze.otherPerson.spec.ts"
            "src/tests/businessCard.terminate.spec.ts"
            "src/tests/businessCard.relink.spec.ts"
            "src/tests/pricePlan.spec.ts"
            "src/tests/salaryStipendPension.spec.ts"
          )

          PLATFORMS=()
          case "$PLATFORM_INPUT" in
            android) PLATFORMS=("android") ;;
            ios)     PLATFORMS=("ios") ;;
            *)       PLATFORMS=("android" "ios") ;;
          esac

          # Optional: restrict the regression matrix to a hand-picked list of specs.
          # Leave REGRESSION_SPECS_INPUT empty to run the full matrix as before.
          if [[ -n "$REGRESSION_SPECS_INPUT" ]]; then
            IFS=',' read -ra REQUESTED_SPECS <<< "$REGRESSION_SPECS_INPUT"
            TRIMMED_SPECS=()
            for raw in "${REQUESTED_SPECS[@]}"; do
              trimmed=$(echo "$raw" | xargs)
              [[ -n "$trimmed" ]] && TRIMMED_SPECS+=("$trimmed")
            done

            is_requested() {
              local target="$1"
              for s in "${TRIMMED_SPECS[@]}"; do
                [[ "$target" == "$s" ]] && return 0
              done
              return 1
            }

            NEW_PRIMARY=()
            for spec in "${PRIMARY_SPECS[@]}"; do
              is_requested "$spec" && NEW_PRIMARY+=("$spec")
            done
            PRIMARY_SPECS=("${NEW_PRIMARY[@]}")

            NEW_SECONDARY=()
            for spec in "${SECONDARY_SPECS[@]}"; do
              is_requested "$spec" && NEW_SECONDARY+=("$spec")
            done
            SECONDARY_SPECS=("${NEW_SECONDARY[@]}")

            for requested in "${TRIMMED_SPECS[@]}"; do
              found=false
              for spec in "${PRIMARY_SPECS[@]}" "${SECONDARY_SPECS[@]}"; do
                [[ "$spec" == "$requested" ]] && found=true && break
              done
              [[ "$found" == "false" ]] && echo "::warning::regression_specs entry not found in the regression matrix: $requested"
            done

            echo "Filtered to requested specs: ${TRIMMED_SPECS[*]}"
          else
            # No exact spec list given — fall back to the checkpoint checkboxes.
            # Each spec belongs to exactly one checkpoint category; unchecking a
            # category drops its specs from both lanes.
            declare -A SPEC_CHECKPOINT=(
              ["src/tests/launch.spec.ts"]="CHECKPOINT_HOME"
              ["src/tests/homeSearch.spec.ts"]="CHECKPOINT_HOME"
              ["src/tests/homeSpendAnalytics.spec.ts"]="CHECKPOINT_HOME"
              ["src/tests/homeStoryly.spec.ts"]="CHECKPOINT_HOME"
              ["src/tests/homeScreen.spec.ts"]="CHECKPOINT_HOME"
              ["src/tests/homeAccountSwitch.spec.ts"]="CHECKPOINT_HOME"

              ["src/tests/addFundsBankTransferWalletManager.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/bankTransfer.p2p.individual.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/bankTransfer.sepa.individual.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/bankTransfer.swift.individual.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/crossBorder.swift.retail.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/vop.beneficiary.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/vop.sepa.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/addbeneficiary.individual.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/addbeneficiary.individual.usd.steps.spec.ts"]="CHECKPOINT_PAYMENTS"
              ["src/tests/addfunds.spec.ts"]="CHECKPOINT_PAYMENTS"

              ["src/tests/assignBusinessCard.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.adminSelfAssign.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.cardLimits.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.noRights.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.walletReachOut.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.freezeUnfreeze.otherPerson.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.terminate.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/businessCard.relink.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/cardFreezeUnfreeze.joint.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/cardManagement.joint.spec.ts"]="CHECKPOINT_CARDS"
              ["src/tests/physicalcardcreation.spec.ts"]="CHECKPOINT_CARDS"

              ["src/tests/portfolio.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/orders.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/orders.regression.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/priceAlerts.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/watchlist.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/fxExchange.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/fxExchange.regression.spec.ts"]="CHECKPOINT_INVEST"
              ["src/tests/cashFunds.spec.ts"]="CHECKPOINT_INVEST"

              ["src/tests/onboarding.spec.ts"]="CHECKPOINT_AUTH_ONBOARDING"
              ["src/tests/personalDetails.spec.ts"]="CHECKPOINT_AUTH_ONBOARDING"
              ["src/tests/authentication.incorrectPasscode.spec.ts"]="CHECKPOINT_AUTH_ONBOARDING"
              ["src/tests/authentication.passcodeLockout.spec.ts"]="CHECKPOINT_AUTH_ONBOARDING"
              ["src/tests/authentication.otpCountdown.spec.ts"]="CHECKPOINT_AUTH_ONBOARDING"

              ["src/tests/autoTopUp.spec.ts"]="CHECKPOINT_ACCOUNT_MISC"
              ["src/tests/transactions.spec.ts"]="CHECKPOINT_ACCOUNT_MISC"
              ["src/tests/pricePlan.spec.ts"]="CHECKPOINT_ACCOUNT_MISC"
              ["src/tests/salaryStipendPension.spec.ts"]="CHECKPOINT_ACCOUNT_MISC"
            )

            checkpoint_enabled() {
              local spec="$1"
              local category="${SPEC_CHECKPOINT[$spec]}"
              if [[ -z "$category" ]]; then
                echo "::warning::Spec has no checkpoint category mapping, including it by default: $spec"
                return 0
              fi
              [[ "${!category}" == "true" ]]
            }

            NEW_PRIMARY=()
            for spec in "${PRIMARY_SPECS[@]}"; do
              checkpoint_enabled "$spec" && NEW_PRIMARY+=("$spec")
            done
            PRIMARY_SPECS=("${NEW_PRIMARY[@]}")

            NEW_SECONDARY=()
            for spec in "${SECONDARY_SPECS[@]}"; do
              checkpoint_enabled "$spec" && NEW_SECONDARY+=("$spec")
            done
            SECONDARY_SPECS=("${NEW_SECONDARY[@]}")

            echo "Checkpoints — home:$CHECKPOINT_HOME payments:$CHECKPOINT_PAYMENTS cards:$CHECKPOINT_CARDS invest:$CHECKPOINT_INVEST auth/onboarding:$CHECKPOINT_AUTH_ONBOARDING account/misc:$CHECKPOINT_ACCOUNT_MISC"
          fi

          INCLUDE="[]"
          PRIMARY_INCLUDE="[]"
          SECONDARY_INCLUDE="[]"

          for platform in "${PLATFORMS[@]}"; do
            for spec in "${PRIMARY_SPECS[@]}"; do
              entry=$(jq -c -n --arg p "$platform" --arg s "$spec" \
                '{"platform": $p, "spec": $s, "smoke": false, "authSlot": "primary"}')
              INCLUDE=$(echo "$INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
              PRIMARY_INCLUDE=$(echo "$PRIMARY_INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
            done
            for spec in "${SECONDARY_SPECS[@]}"; do
              entry=$(jq -c -n --arg p "$platform" --arg s "$spec" \
                '{"platform": $p, "spec": $s, "smoke": false, "authSlot": "secondary"}')
              INCLUDE=$(echo "$INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
              SECONDARY_INCLUDE=$(echo "$SECONDARY_INCLUDE" | jq -c --argjson e "$entry" '. += [$e]')
            done
          done

          MATRIX=$(jq -c -n --argjson inc "$INCLUDE" '{"include": $inc}')
          PRIMARY_MATRIX=$(jq -c -n --argjson inc "$PRIMARY_INCLUDE" '{"include": $inc}')
          SECONDARY_MATRIX=$(jq -c -n --argjson inc "$SECONDARY_INCLUDE" '{"include": $inc}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "primary_matrix=$PRIMARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "secondary_matrix=$SECONDARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $PLATFORM_INPUT"
          echo "Primary jobs: $(echo "$PRIMARY_INCLUDE" | jq 'length')"
          echo "Secondary jobs: $(echo "$SECONDARY_INCLUDE" | jq 'length')"

  e2e-regression:
    name: "REGRESSION parallel 1 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: [setup-regression, e2e-smoke, e2e-smoke-secondary]
    if: >
      needs.setup-regression.result == 'success' &&
      (needs.e2e-smoke.result == 'success' || needs.e2e-smoke.result == 'failure' || needs.e2e-smoke.result == 'skipped') &&
      (needs.e2e-smoke-secondary.result == 'success' || needs.e2e-smoke-secondary.result == 'failure' || needs.e2e-smoke-secondary.result == 'skipped')
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.primary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},regression
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        if: env.AUTH_SECURITY_MB_PHONE == ''
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-regression-secondary:
    name: "REGRESSION parallel 2 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: [setup-regression, e2e-smoke, e2e-smoke-secondary]
    if: >
      needs.setup-regression.result == 'success' &&
      (needs.e2e-smoke.result == 'success' || needs.e2e-smoke.result == 'failure' || needs.e2e-smoke.result == 'skipped') &&
      (needs.e2e-smoke-secondary.result == 'success' || needs.e2e-smoke-secondary.result == 'failure' || needs.e2e-smoke-secondary.result == 'skipped')
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-regression.outputs.secondary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      AUTH_SECURITY_MB_PHONE: ${{ secrets.AUTH_SECURITY_MB_PHONE }}
      AUTH_SECURITY_MB_PIN: ${{ secrets.AUTH_SECURITY_MB_PIN }}
      AUTH_SECURITY_OTP_PHONE: ${{ secrets.AUTH_SECURITY_OTP_PHONE }}
      BH_MB_COUNTRY: ${{ secrets.BH_MB_COUNTRY }}
      BH_MB_PHONE: ${{ secrets.BH_MB_PHONE }}
      BH_MB_PIN: ${{ secrets.BH_MB_PIN }}
      BH_OTP_PHONE: ${{ secrets.BH_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: regression-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},regression,secondary
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ADD_BENEFICIARY_LOGIN_USE_API_OTP: "false"
      PHYSICAL_CARD_LOGIN_USE_API_OTP: "false"
      CARD_FREEZE_LOGIN_USE_API_OTP: "true"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download onboarded accounts from smoke run
        uses: actions/download-artifact@v4
        with:
          pattern: onboarded-accounts-smoke-${{ matrix.platform }}-secondary-*
          path: .generated
          merge-multiple: true
        continue-on-error: true

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # JIRA SYNC
  # ---------------------------------------------------------------------
  sync-jira:
    name: Sync failures to JIRA
    runs-on: arc-runner-mb-deploy-stg-scale-set
    needs: [e2e-smoke, e2e-smoke-secondary, e2e-regression, e2e-regression-secondary]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Sync failures to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          ALLURE_RESULTS_DIR: ./allure-results
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ISSUES_PER_RUN: "15"
          DRY_RUN: "false"
        run: |
          echo "=== JIRA SYNC: START ==="
          node scripts/allure-jira-sync/sync-allure-to-jira.cjs 2>&1 | tee jira-sync.log
          echo "=== JIRA SYNC: END (exit code ${PIPESTATUS[0]}) ==="

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-sync-log
          path: jira-sync.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # REPORT
  # ---------------------------------------------------------------------
  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-smoke-secondary, e2e-regression, e2e-regression-secondary]
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Generate combined Allure report
        run: |
          npx -y allure-commandline@2 generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
