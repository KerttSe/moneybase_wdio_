name: WDIO Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      bs_app_ios:
        description: "BrowserStack iOS app id (bs://...). Overrides BS_APP_IOS secret."
        required: false
        type: string
      bs_app_android:
        description: "BrowserStack Android app id (bs://...). Overrides BS_APP_ANDROID secret."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  setup-smoke:
    name: Build smoke matrix
    runs-on: arc-runner-mb-deploy-stg-scale-set
    outputs:
      primary_matrix: ${{ steps.build.outputs.primary_matrix }}
      secondary_matrix: ${{ steps.build.outputs.secondary_matrix }}
    steps:
      - name: Build smoke matrix filtered by platform
        id: build
        shell: bash
        env:
          PLATFORM_INPUT: ${{ github.event.inputs.platform || 'all' }}
        run: |
          # 2 BrowserStack parallels, one lane each. Each lane owns 3 accounts and rotates them, so an
          # account never runs in both lanes and two other accounts' specs separate its logins.
          # primary=VEG, secondary=KER, the other slots are named after their account.
          LANE_1=(
            "primary:src/tests/Cards/card-management/cardFreezeUnfreeze.joint.spec.ts"
            "rog:src/tests/Cards/card-management/physicalcardcreation.spec.ts"
            "mum:src/tests/Payments/bank-transfers/bankTransfer.swift.individual.spec.ts"
            "primary:src/tests/Invest/portfolio/portfolio.spec.ts"
            "rog:src/tests/Core/home-page/homeScreen.spec.ts"
            "mum:src/tests/Invest/orders/orders.spec.ts"
            "primary:src/tests/Payments/add-funds/autoTopUp.spec.ts"
            "rog:src/tests/Core/auth/launch.spec.ts"
            "mum:src/tests/Payments/fx-exchange/fxExchange.spec.ts"
            "primary:src/tests/Payments/bank-transfers/bankTransfer.sepa.individual.spec.ts"
          )
          LANE_2=(
            "secondary:src/tests/Payments/add-funds/addfunds.spec.ts"
            "laz:src/tests/Core/home-page/homeSearch.spec.ts"
            "pop:src/tests/Invest/discover-section/cashFunds.spec.ts"
            "secondary:src/tests/Payments/beneficiaries/addbeneficiary.individual.spec.ts"
            "laz:src/tests/Core/home-page/homeSearch.business.spec.ts"
            "pop:src/tests/Invest/watchlist/priceAlerts.spec.ts"
            "secondary:src/tests/Core/home-page/homeAccountSwitch.spec.ts"
            "laz:src/tests/Payments/bank-transfers/bankTransfer.p2p.individual.spec.ts"
            "pop:src/tests/Invest/watchlist/watchlist.spec.ts"
            "secondary:src/tests/Core/onboarding/onboarding.spec.ts"
          )

          PLATFORMS=()
          case "$PLATFORM_INPUT" in
            android) PLATFORMS=("android") ;;
            ios)     PLATFORMS=("ios") ;;
            *)       PLATFORMS=("android" "ios") ;;
          esac

          lane_matrix() {
            local include="[]"
            for platform in "${PLATFORMS[@]}"; do
              for entry in "$@"; do
                include=$(echo "$include" | jq -c \
                  --arg p "$platform" --arg s "${entry#*:}" --arg slot "${entry%%:*}" \
                  '. += [{"platform": $p, "spec": $s, "smoke": true, "authSlot": $slot}]')
              done
            done
            jq -c -n --argjson inc "$include" '{"include": $inc}'
          }

          PRIMARY_MATRIX=$(lane_matrix "${LANE_1[@]}")
          SECONDARY_MATRIX=$(lane_matrix "${LANE_2[@]}")
          echo "primary_matrix=$PRIMARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "secondary_matrix=$SECONDARY_MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected platform: $PLATFORM_INPUT"
          echo "Lane 1 jobs: $(echo "$PRIMARY_MATRIX" | jq '.include | length')"
          echo "Lane 2 jobs: $(echo "$SECONDARY_MATRIX" | jq '.include | length')"

  e2e-smoke:
    name: "SMOKE lane 1 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-smoke
    if: needs.setup-smoke.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-smoke.outputs.primary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      MB_ROG_PHONE: ${{ secrets.MB_ROG_PHONE }}
      MB_ROG_PIN: ${{ secrets.MB_ROG_PIN }}
      MB_MUM_PHONE: ${{ secrets.MB_MUM_PHONE }}
      MB_MUM_PIN: ${{ secrets.MB_MUM_PIN }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},smoke
      BS_MAX_INSTANCES: "1"
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload onboarded accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-accounts-smoke-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: .generated/onboarded-accounts.json
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.platform }}-primary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  e2e-smoke-secondary:
    name: "SMOKE lane 2 (${{ matrix.platform }}) — ${{ matrix.spec }}"
    needs: setup-smoke
    if: needs.setup-smoke.result == 'success'
    runs-on: arc-runner-mb-deploy-stg-scale-set
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-smoke.outputs.secondary_matrix) }}
    env:
      MB_AUTH_SLOT: ${{ matrix.authSlot }}
      MB_COUNTRY: ${{ secrets.MB_COUNTRY }}
      MB_PHONE: ${{ secrets.MB_PHONE }}
      MB_PIN: ${{ secrets.MB_PIN }}
      MB_LAZ_PHONE: ${{ secrets.MB_LAZ_PHONE }}
      MB_LAZ_PIN: ${{ secrets.MB_LAZ_PIN }}
      MB_POP_PHONE: ${{ secrets.MB_POP_PHONE }}
      MB_POP_PIN: ${{ secrets.MB_POP_PIN }}
      AUTH_OTP_MB_PHONE: ${{ secrets.AUTH_OTP_MB_PHONE }}
      AUTH_OTP_MB_PIN: ${{ secrets.AUTH_OTP_MB_PIN }}
      AUTH_OTP_OTP_PHONE: ${{ secrets.AUTH_OTP_OTP_PHONE }}
      BROWSERSTACK: "true"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_ANDROID: ${{ github.event.inputs.bs_app_android || secrets.BS_APP_ANDROID }}
      BS_APP_IOS: ${{ github.event.inputs.bs_app_ios || secrets.BS_APP_IOS }}
      PLATFORM: ${{ matrix.platform }}
      BS_BUILD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_TAGS: ${{ matrix.spec }},${{ matrix.platform }},smoke,secondary
      BS_MAX_INSTANCES: "1"
      OTP_FORCE_RESEND_BEFORE_FETCH: "false"
      OTP_FETCH_DELAY_MS: "5000"
      OTP_GET_LATEST_URL: ${{ secrets.OTP_GET_LATEST_URL }}
      OTP_RESEND_WAIT_MS: "0"
      ONBOARDED_ACCOUNTS_FILE: ".generated/onboarded-accounts.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run wdio -- --spec ${{ matrix.spec }}

      - name: Upload onboarded accounts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarded-accounts-smoke-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: .generated/onboarded-accounts.json
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.platform }}-secondary-${{ strategy.job-index }}
          path: allure-results
          if-no-files-found: warn

  sync-jira:
    name: Sync failures to JIRA
    runs-on: arc-runner-mb-deploy-stg-scale-set
    needs: [e2e-smoke, e2e-smoke-secondary]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Sync failures to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          ALLURE_RESULTS_DIR: ./allure-results
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ISSUES_PER_RUN: "15"
          DRY_RUN: "false"
        run: |
          echo "=== JIRA SYNC: START ==="
          node scripts/allure-jira-sync/sync-allure-to-jira.cjs 2>&1 | tee jira-sync.log
          echo "=== JIRA SYNC: END (exit code ${PIPESTATUS[0]}) ==="

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-sync-log
          path: jira-sync.log
          if-no-files-found: warn

  deploy-pages:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-smoke-secondary]
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: ./allure-results
          merge-multiple: true

      - name: Generate combined Allure report
        run: |
          npx -y allure-commandline@2 generate ./allure-results -o ./allure-report --clean

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
